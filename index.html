<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card Creator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js library for dynamic QR code generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        
        <!-- STEP 1: INPUT FORM -->
        <div id="stepForm">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Create Your Card</h1>
                <p class="text-sm text-slate-500 mt-1">Enter your details below to generate your smart business card.</p>
            </div>

            <form id="cardForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Full Name</label>
                    <input type="text" id="name" value="Jorge Aguilar-Teuffer" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Job Title & Company</label>
                    <input type="text" id="title" value="Independent Contractor" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Phone Number</label>
                    <input type="tel" id="phone" value="+15550192834" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email Address</label>
                    <input type="email" id="email" value="jorge@example.com" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Website / Portfolio URL</label>
                    <input type="url" id="website" value="https://example.com" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>

                <button type="button" onclick="saveAndGenerate()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow transition duration-200 cursor-pointer">
                    Save & Generate Card 🚀
                </button>
            </form>
        </div>

        <!-- STEP 2: VIRTUAL CARD & OUTPUT (Initially Hidden) -->
        <div id="stepOutput" class="hidden flex flex-col items-center text-center">
            <div class="w-full flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">Your Digital Card</h2>
                <button onclick="editForm()" class="text-xs text-blue-600 hover:underline font-medium">✏️ Edit Info</button>
            </div>

            <!-- Virtual Card Visual Display -->
            <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-xl w-full text-left space-y-3 relative overflow-hidden mb-6">
                <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
                <h3 id="outName" class="text-2xl font-bold tracking-tight"></h3>
                <p id="outTitle" class="text-blue-300 text-sm font-medium"></p>
                <div class="pt-4 space-y-2 text-sm border-t border-slate-700/60 text-slate-200">
                    <p id="outPhone">📱 </p>
                    <p id="outEmail">✉️ </p>
                    <p id="outWebsite">🌐 </p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="w-full space-y-3">
                <button onclick="downloadVCard()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                    <span>👤</span> Save Contact (.vcf)
                </button>

                <button onclick="writeNfcTag()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <span>📡</span> Write to NFC Tag (Android)
                </button>
                <p id="nfcStatus" class="text-xs text-slate-500"></p>
            </div>

            <!-- QR Code Section -->
            <div class="mt-6 pt-6 border-t border-slate-100 w-full flex flex-col items-center">
                <div id="qrcode" class="p-3 bg-white border border-slate-200 rounded-xl shadow-sm inline-block"></div>
                <p class="text-xs text-slate-500 mt-2 font-medium">Scan QR Code to view & save</p>
            </div>
        </div>

    </div>

    <!-- Script Logic for Two-Step Transition and Outputs -->
    <script>
        let cardData = {};

        function saveAndGenerate() {
            // Grab input values
            cardData.name = document.getElementById('name').value.trim();
            cardData.title = document.getElementById('title').value.trim();
            cardData.phone = document.getElementById('phone').value.trim();
            cardData.email = document.getElementById('email').value.trim();
            cardData.website = document.getElementById('website').value.trim();

            if (!cardData.name) {
                alert("Please enter at least your full name.");
                return;
            }

            // Populate the output card display
            document.getElementById('outName').innerText = cardData.name;
            document.getElementById('outTitle').innerText = cardData.title;
            document.getElementById('outPhone').innerText = `📱 ${cardData.phone}`;
            document.getElementById('outEmail').innerText = `✉️ ${cardData.email}`;
            document.getElementById('outWebsite').innerText = `🌐 ${cardData.website.replace('https://','').replace('http://','')}`;

            // Generate QR Code pointing to live site URL or website fallback
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = "";
            let targetUrl = window.location.href.startsWith("http") ? window.location.href : (cardData.website || "https://example.com");
            
            new QRCode(qrcodeContainer, {
                text: targetUrl,
                width: 120,
                height: 120
            });

            // Switch views from Step 1 to Step 2
            document.getElementById('stepForm').classList.add('hidden');
            document.getElementById('stepOutput').classList.remove('hidden');
        }

        function editForm() {
            // Switch back to Step 1
            document.getElementById('stepOutput').classList.add('hidden');
            document.getElementById('stepForm').classList.remove('hidden');
        }

        function downloadVCard() {
            const nameParts = cardData.name.split(" ");
            const firstName = nameParts[0] || "";
            const lastName = nameParts.slice(1).join(" ") || "";

            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:${lastName};${firstName};;;`,
                `FN:${cardData.name}`,
                `TITLE:${cardData.title}`,
                `TEL;TYPE=CELL:${cardData.phone}`,
                `EMAIL:${cardData.email}`,
                `URL:${cardData.website}`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${cardData.name.replace(/\s+/g, '_')}_card.vcf`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function writeNfcTag() {
            const statusEl = document.getElementById('nfcStatus');
            if (!('NDEFWriter' in window)) {
                statusEl.innerText = "Web NFC requires Android Chrome. Alternatively, use 'NFC Tools' mobile app to write your page URL.";
                statusEl.className = "text-xs text-amber-600 mt-1 font-medium";
                return;
            }

            try {
                const writer = new NDEFWriter();
                statusEl.innerText = "Ready! Hold NFC tag near device...";
                statusEl.className = "text-xs text-blue-600 mt-1 font-medium";

                let targetUrl = window.location.href.startsWith("http") ? window.location.href : cardData.website;
                
                await writer.write({
                    records: [{ recordType: "url", data: targetUrl }]
                });

                statusEl.innerText = "Success! NFC tag successfully programmed.";
                statusEl.className = "text-xs text-emerald-600 mt-1 font-medium";
            } catch (error) {
                statusEl.innerText = "Error: " + error;
                statusEl.className = "text-xs text-red-500 mt-1";
            }
        }
    </script>
</body>
</html>
