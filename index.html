<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-10 px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        
        <div id="stepForm">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Card Setup</h1>
                <p class="text-sm text-slate-500 mt-1">Enter your details to generate your permanent card link & QR code.</p>
            </div>

            <form id="cardForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Full Name</label>
                    <input type="text" id="name" value="Jorge Aguilar-Teuffer" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Job Title & Company</label>
                    <input type="text" id="title" value="Independent Contractor" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Phone Number</label>
                    <input type="tel" id="phone" value="+15550192834" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email Address</label>
                    <input type="email" id="email" value="jorge@example.com" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Website / Portfolio URL</label>
                    <input type="url" id="website" value="https://example.com" class="mt-1 w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>

                <button type="button" onclick="generateOutput()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow transition duration-200 cursor-pointer">
                    Generate Public Card Link 🚀
                </button>
            </form>
        </div>

        <!-- Output section -->
        <div id="stepOutput" class="hidden flex flex-col items-center text-center">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Ready to Deploy!</h2>
            <p class="text-xs text-slate-500 mb-4">Program your NFC tag and print your QR code using this exact link:</p>
            
            <div class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 break-all text-xs font-mono text-blue-600 select-all" id="publicLinkDisplay"></div>

            <div class="p-3 bg-white border border-slate-200 rounded-xl shadow-sm inline-block mb-4">
                <div id="qrcode"></div>
            </div>

            <button onclick="location.reload()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-xl text-sm transition">
                Back to Edit
            </button>
        </div>
    </div>

    <script>
        function generateOutput() {
            const name = document.getElementById('name').value.trim();
            const title = document.getElementById('title').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const website = document.getElementById('website').value.trim();

            if (!name) {
                alert("Please enter your name.");
                return;
            }

            // Pack input data into URL query parameters
            const params = new URLSearchParams({
                name: name,
                title: title,
                phone: phone,
                email: email,
                website: website
            });

            // Build the absolute public link pointing to card.html with data attached
            let baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            let publicUrl = baseUrl + "card.html?" + params.toString();

            document.getElementById('publicLinkDisplay').innerText = publicUrl;

            // Generate QR code pointing strictly to the data-encoded URL
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = "";
            new QRCode(qrcodeContainer, {
                text: publicUrl,
                width: 130,
                height: 130
            });

            document.getElementById('stepForm').classList.add('hidden');
            document.getElementById('stepOutput').classList.remove('hidden');
        }
    </script>
</body>
</html>
