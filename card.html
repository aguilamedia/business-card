<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center text-center">
        
        <h1 class="text-xl font-bold text-slate-800 mb-6">Digital Business Card</h1>

        <!-- Virtual Card Visual Display -->
        <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-xl w-full text-left space-y-3 relative overflow-hidden mb-6">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
            <h3 id="outName" class="text-2xl font-bold tracking-tight"></h3>
            <p id="outTitle" class="text-blue-300 text-sm font-medium"></p>
            <div class="pt-4 space-y-2 text-sm border-t border-slate-700/60 text-slate-200">
                <p id="outPhone">📱 </p>
                <p id="outEmail">✉️ </p>
                <p id="outWebsite">🌐 </p>
            </div>
        </div>

        <!-- Action Button to Save Contact -->
        <div class="w-full space-y-3">
            <button onclick="downloadVCard()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                <span>👤</span> Save Contact (.vcf)
            </button>
        </div>
        
    </div>

    <script>
        // Read data directly from the URL query parameters
        const urlParams = new URLSearchParams(window.location.search);

        let cardData = {
            name: urlParams.get('name') || "Jorge Aguilar-Teuffer",
            title: urlParams.get('title') || "Independent Contractor",
            phone: urlParams.get('phone') || "+15550192834",
            email: urlParams.get('email') || "jorge@example.com",
            website: urlParams.get('website') || "https://example.com"
        };

        // Render card info onto the public page
        document.getElementById('outName').innerText = cardData.name;
        document.getElementById('outTitle').innerText = cardData.title;
        document.getElementById('outPhone').innerText = `📱 ${cardData.phone}`;
        document.getElementById('outEmail').innerText = `✉️ ${cardData.email}`;
        document.getElementById('outWebsite').innerText = `🌐 ${cardData.website.replace('https://','').replace('http://','')}`;

        function downloadVCard() {
            const nameParts = cardData.name.split(" ");
            const firstName = nameParts[0] || "";
            const lastName = nameParts.slice(1).join(" ") || "";

            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:${lastName};${firstName};;;`,
                `FN:${cardData.name}`,
                `TITLE:${cardData.title}`,
                `TEL;TYPE=CELL:${cardData.phone}`,
                `EMAIL:${cardData.email}`,
                `URL:${cardData.website}`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${cardData.name.replace(/\s+/g, '_')}_card.vcf`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
