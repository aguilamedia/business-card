<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center text-center relative overflow-hidden">
        
        <h1 class="text-xl font-bold text-slate-800 mb-6">Digital Business Card</h1>

        <!-- Virtual Card Visual Display -->
        <div id="cardBox" class="text-white p-6 rounded-2xl shadow-xl w-full text-left space-y-3 relative overflow-hidden mb-6 transition-all duration-300">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            
            <h3 id="outName" class="text-2xl font-bold tracking-tight"></h3>
            <p id="outTitle" class="text-white/80 text-sm font-medium"></p>
            <div id="cardDivider" class="pt-4 space-y-2 text-sm border-t text-white/90">
                <p id="outPhone">📱 </p>
                <p id="outEmail">✉️ </p>
                <p id="outWebsite">🌐 </p>
            </div>

            <!-- Socials Container -->
            <div id="socialsContainer" class="pt-3 flex flex-wrap gap-2 hidden"></div>
        </div>

        <!-- Action Button to Save Contact -->
        <div class="w-full space-y-3">
            <button id="saveBtn" onclick="saveContactDirectly()" class="w-full text-white font-semibold py-3.5 px-4 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                <span>👤</span> Save Contact
            </button>
        </div>

        <!-- Thank You Overlay Modal -->
        <div id="thankYouModal" class="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-all duration-300 opacity-0 pointer-events-none transform scale-95">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mb-4 shadow-sm animate-bounce">
                ✓
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Thank You!</h2>
            <p class="text-sm text-slate-600 mt-2">Opening contact card...</p>
            
            <button onclick="closeThankYou()" class="mt-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs py-2 px-4 rounded-lg transition">
                Close
            </button>
        </div>
        
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        let cardData = {
            name: urlParams.get('name') || "Jorge Aguilar-Teuffer",
            title: urlParams.get('title') || "Independent Contractor",
            phone: urlParams.get('phone') || "+15550192834",
            email: urlParams.get('email') || "jorge@example.com",
            website: urlParams.get('website') || "https://example.com",
            socials: [
                urlParams.get('social1'),
                urlParams.get('social2'),
                urlParams.get('social3')
            ].filter(Boolean),
            theme: urlParams.get('theme') || "midnight"
        };

        const themes = {
            midnight: {
                cardClass: "bg-gradient-to-br from-slate-900 to-indigo-950",
                dividerClass: "border-slate-700/60",
                btnClass: "bg-indigo-600 hover:bg-indigo-700"
            },
            emerald: {
                cardClass: "bg-gradient-to-br from-emerald-950 to-teal-900",
                dividerClass: "border-emerald-700/60",
                btnClass: "bg-emerald-600 hover:bg-emerald-700"
            },
            sunset: {
                cardClass: "bg-gradient-to-br from-rose-950 to-amber-950",
                dividerClass: "border-rose-700/60",
                btnClass: "bg-rose-600 hover:bg-rose-700"
            },
            purple: {
                cardClass: "bg-gradient-to-br from-purple-950 to-slate-950",
                dividerClass: "border-purple-700/60",
                btnClass: "bg-purple-600 hover:bg-purple-700"
            },
            slate: {
                cardClass: "bg-gradient-to-br from-slate-800 to-slate-900",
                dividerClass: "border-slate-600/60",
                btnClass: "bg-slate-700 hover:bg-slate-800"
            }
        };

        // Apply theme styles
        const selectedTheme = themes[cardData.theme] || themes.midnight;
        document.getElementById('cardBox').className += ` ${selectedTheme.cardClass}`;
        document.getElementById('cardDivider').className += ` ${selectedTheme.dividerClass}`;
        document.getElementById('saveBtn').className += ` ${selectedTheme.btnClass}`;

        // Render card text info
        document.getElementById('outName').innerText = cardData.name;
        document.getElementById('outTitle').innerText = cardData.title;
        document.getElementById('outPhone').innerText = `📱 ${cardData.phone}`;
        document.getElementById('outEmail').innerText = `✉️ ${cardData.email}`;
        document.getElementById('outWebsite').innerText = `🌐 ${cardData.website.replace('https://','').replace('http://','')}`;

        function getSocialDetails(url) {
            let lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('linkedin.com')) return { name: 'LinkedIn', icon: '🔗' };
            if (lowerUrl.includes('github.com')) return { name: 'GitHub', icon: '💻' };
            if (lowerUrl.includes('twitter.com') || lowerUrl.includes('x.com')) return { name: 'Twitter / X', icon: '🐦' };
            if (lowerUrl.includes('instagram.com')) return { name: 'Instagram', icon: '📸' };
            if (lowerUrl.includes('youtube.com')) return { name: 'YouTube', icon: '▶️' };
            if (lowerUrl.includes('facebook.com')) return { name: 'Facebook', icon: '👥' };
            return { name: 'Social', icon: '🌐' };
        }

        const socialsContainer = document.getElementById('socialsContainer');
        if (cardData.socials.length > 0) {
            socialsContainer.classList.remove('hidden');
            cardData.socials.forEach(url => {
                let formattedUrl = url.startsWith('http') ? url : 'https://' + url;
                let details = getSocialDetails(url);

                let a = document.createElement('a');
                a.href = formattedUrl;
                a.target = "_blank";
                a.className = "inline-flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-white text-xs font-medium py-1.5 px-3 rounded-lg backdrop-blur-sm transition border border-white/10";
                a.innerHTML = `<span>${details.icon}</span> ${details.name}`;
                socialsContainer.appendChild(a);
            });
        }

        function saveContactDirectly() {
            const nameParts = cardData.name.split(" ");
            const firstName = nameParts[0] || "";
            const lastName = nameParts.slice(1).join(" ") || "";

            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:${lastName};${firstName};;;`,
                `FN:${cardData.name}`,
                `TITLE:${cardData.title}`,
                `TEL;TYPE=CELL:${cardData.phone}`,
                `EMAIL:${cardData.email}`,
                `URL:${cardData.website}`,
                "END:VCARD"
            ].join("\r\n");

            // Direct inline trigger via URI encoding
            const vcardDataUri = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
            
            // Replaces background download flow with immediate location assignment
            window.location.href = vcardDataUri;

            showThankYou();
        }

        function showThankYou() {
            const modal = document.getElementById('thankYouModal');
            modal.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
            modal.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
        }

        function closeThankYou() {
            const modal = document.getElementById('thankYouModal');
            modal.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            modal.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
        }
    </script>
</body>
</html>
